# B1 CI：与本地命令一致——PG service → pytest → ruff/mypy 基线 → 代号化验收
# → desktop typecheck + vitest。核心步骤无 continue-on-error。
#
# 服务端测试走隔离测试库 fde_workbench_test（conftest 双重断言：库名必须
# *_test，且整个会话持 advisory lock 串行化）；冒烟脚本经 pytest 自动入口
# 在同一隔离库执行（B6），口令随机生成（C11）；代号化验收扫的是 CI 自己的
# service 库 + 合成黑名单 fixture（B7），绝不触碰任何开发/生产库。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fde
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: fde_workbench_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U fde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FDE_TEST_DATABASE_URL: postgresql+psycopg://fde:ci-postgres@127.0.0.1:15432/fde_workbench_test
      FDE_TEST_REDIS_URL: redis://127.0.0.1:16379/2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install server dependencies (test + dev extras)
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[test,dev]"

      - name: ruff (F401/F841 unused imports & variables)
        working-directory: server
        run: .venv/bin/python -m ruff check --select F401,F841 src tests

      - name: mypy (baseline + no new errors)
        run: python scripts/check-python-types.py

      - name: pytest (isolated PostgreSQL test database)
        working-directory: server
        run: PYTHONPATH=src .venv/bin/python -m pytest -q

  pseudonymization:
    # B7：代号化验收。扫 CI 自己的 service 库（合成数据），黑名单来自
    # 仓库内的合成 fixture（FDE_LEADS_MD 显式传入），并先跑 --self-test
    # 证明扫描器灵敏度（没自测过的校验器等于没有校验器）。
    runs-on: ubuntu-latest
    needs: server-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fde
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: fde_workbench_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U fde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FDE_LEADS_MD: ${{ github.workspace }}/.github/ci-assets/synthetic-leads-blacklist.txt
    steps:
      - uses: actions/checkout@v4

      - name: Resolve service container and run the check
        run: |
          set -euo pipefail
          container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -1)"
          [ -n "$container" ] || { echo "postgres service container not found"; exit 1; }
          export FDE_PG_CONTAINER="$container"
          export FDE_PG_USER=fde
          export FDE_PG_DB=fde_workbench_test
          # 合成黑名单里的名字必须出现在库里才会命中——先注入哨兵行证明
          # 扫描器抓得到（抓不到 = 扫描器坏了），再清理重扫。
          bash scripts/check-pseudonymization.sh --self-test

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: npm ci

      - name: typecheck (renderer + renderer tests, zero error)
        run: npx tsc -p desktop/tsconfig.web.json --noEmit

      - name: vitest (desktop, serial)
        run: npm --workspace desktop test
